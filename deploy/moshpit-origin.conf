# nginx template for a riotcoder-owned Moshpit name on dev2, used by setup-origin.sh
# (MOSHPIT_TEMPLATE). NAME is replaced with the name. Serves 80 and 443 without a
# redirect, like every Moshpit vhost on dev2, and proxies to family.ancestry on 8792.
# Installed at /etc/moshpit/riotcoder-origin.conf; renewals rewrite the site from it,
# so edit this file (and copy it there), never the generated site.
server {
    listen 80;
    listen [::]:80;
    server_name NAME;
    access_log off;
    error_log  /var/log/nginx/NAME.error.log crit;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name NAME;
    ssl_certificate     /etc/ssl/moshpit-riotcoder/NAME.crt;
    ssl_certificate_key /etc/ssl/moshpit-riotcoder/NAME.key;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_conf_command Groups X25519MLKEM768:X25519:P-256;
    ssl_session_tickets off;
    ssl_session_cache shared:MoshpitSSL:10m;
    access_log off;
    error_log  /var/log/nginx/NAME.error.log crit;
    client_max_body_size 30m;
    location / {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
