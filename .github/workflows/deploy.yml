# Ship every merge to dev2, where family.ancestry runs as root from /opt/family.ancestry.
# FA_DEPLOY_KEY is a root key restricted on dev2 to one forced command,
# /usr/local/bin/family-ancestry-deploy, which takes a commit already on origin/main,
# fast-forwards the checkout to it and runs bin/install.sh. It can do nothing else.
name: Deploy to dev2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev2-family-ancestry
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up ssh
        env:
          SSH_KEY: ${{ secrets.FA_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FA_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SHA: ${{ github.sha }}
        run: ssh -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/id_ed25519 root@dev2.profullstack.com "deploy $SHA"
