# bin/install.sh settings for family.ancestry (OpenInstall: https://logicsrc.com/openinstall).
# No secrets here: RESEND_API_KEY and MAIL_FROM go in $STATE_DIR/app.env, written
# from the logicsrc vault profullstack/family-ancestry--prod.
#
# DOMAINS is empty on purpose: family.ancestry is a Moshpit name, so no CA will
# issue for it. nginx and the registry-signed certificate are set up by hand (see
# README, "Running it"), the same way as seo.rank.
APP=family-ancestry
RUNTIME=bun
INSTALL_CMD=bun install --production --frozen-lockfile
BUILD_CMD=none
START_CMD=bun src/server.ts
PORT=8792
HEALTH_PATH=/health
DOMAINS=
MAX_BODY=30m
ACCESS_LOG=off
